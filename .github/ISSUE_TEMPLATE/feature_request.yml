name: Feature request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One feature request per issue, please. The more real-world your use case is, the easier it is to evaluate.

        Want to build it yourself? Great! Say so below and wait for a short "go" in the issue, so two people don't build the same thing. See CONTRIBUTING.md.

  - type: dropdown
    id: area
    attributes:
      label: Area (tag)
      options:
        - Live TV - accounts / playlists (Xtream, M3U)
        - Live TV - channels / groups / favorites
        - Live TV - EPG / TV guide
        - Live TV - catch-up / time-shift / recordings
        - Live TV - On Demand / Sports / Calendar
        - Playback
        - Streams / Sources
        - Next Episode / Auto-play
        - Watch Progress
        - Subtitles
        - Audio
        - Navigation / Siri Remote
        - UI / Layout
        - Settings
        - Sync (Trakt / remote)
        - Downloads / Offline
        - tvOS / Apple TV integration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: dropdown
    id: contribution_plan
    attributes:
      label: Are you planning to implement this yourself?
      options:
        - No, this is only a proposal
        - Maybe, I could help
        - Yes, I want to build it
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Reference in Nuvio + IPTV (optional)
      description: If this exists in the Android app NuvioPlusIPTV, name the screen or source file.
      placeholder: "e.g. TV guide overlay mode, livetv/ui/LiveTvOverlayMode.kt"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Mockups, examples from other apps, etc.
    validations:
      required: false
