name: PR Template Check

# Checks that a PR fills in .github/PULL_REQUEST_TEMPLATE.md (see CONTRIBUTING.md).
# It only reports a failing check; it never closes or blocks a PR by itself.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate_pr_body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required PR sections
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || "").trim();

            function sectionContent(title) {
              const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const re = new RegExp(`^##\\s+${escaped}(?:\\s*\\([^\\r\\n]*\\))?\\s*$`, "m");
              const match = body.match(re);
              if (!match) return null;
              const start = match.index + match[0].length;
              const rest = body.slice(start);
              const next = rest.search(/^##\s+/m);
              return (next === -1 ? rest : rest.slice(0, next)).trim();
            }

            function cleanedContent(title) {
              const content = sectionContent(title);
              if (content === null) return null;
              return content
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/`/g, "")
                .replace(/\s+/g, " ")
                .trim();
            }

            function checkedLines(content) {
              return (content || "").match(/^\s*-\s+\[[xX]\]\s+.+$/gm) || [];
            }

            function uncheckedLines(content) {
              return (content || "").match(/^\s*-\s+\[\s\]\s+.+$/gm) || [];
            }

            const required = ["Summary", "Type", "Related issue", "Testing", "Screenshots / Video", "Checklist"];
            const missing = [];
            const empty = [];
            const failedRules = [];

            for (const name of required) {
              const content = sectionContent(name);
              if (content === null) {
                missing.push(name);
                continue;
              }
              if (name === "Type" || name === "Checklist") continue;
              const cleaned = cleanedContent(name);
              const allowsShort = name === "Screenshots / Video" || name === "Related issue";
              if (cleaned.length < (allowsShort ? 2 : 4)) {
                empty.push(name);
              }
            }

            const typeContent = sectionContent("Type");
            if (typeContent !== null && checkedLines(typeContent).length !== 1) {
              failedRules.push("Check exactly one Type.");
            }

            const checklistContent = sectionContent("Checklist");
            if (checklistContent !== null && uncheckedLines(checklistContent).length) {
              failedRules.push("Check every box in the Checklist (or explain in the PR why one doesn't apply and check it).");
            }

            if (missing.length || empty.length || failedRules.length) {
              const lines = ["The PR description doesn't follow the PR template yet.", ""];
              if (missing.length) lines.push(`Missing sections: ${missing.join(", ")}`);
              if (empty.length) lines.push(`Empty sections: ${empty.join(", ")}`);
              if (failedRules.length) lines.push(`Rules: ${failedRules.join(" ")}`);
              lines.push("");
              lines.push("Edit the PR description to fill in .github/PULL_REQUEST_TEMPLATE.md; the check re-runs automatically.");
              core.setFailed(lines.join("\n"));
            } else {
              core.info("PR template check passed.");
            }
