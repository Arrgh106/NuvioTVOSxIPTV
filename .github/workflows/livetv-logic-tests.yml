name: Live TV logic tests

# Plain Swift tests for the Live TV logic that has no UIKit (guide timeline).
# Linux, no Xcode: about a minute, so they run on every push next to the
# IPA build.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVTimeline.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVProgrammeInfo.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListWindow.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCatchup.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVReminderList.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGMatch.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGSourceList.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVChannelNames.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListOrder.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCustomGroups.swift'
      - 'Tests/LiveTVLogic/**'
      - '.github/workflows/livetv-logic-tests.yml'
  pull_request:
    paths:
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVTimeline.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVProgrammeInfo.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListWindow.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCatchup.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVReminderList.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGMatch.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGSourceList.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVChannelNames.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListOrder.swift'
      - 'tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCustomGroups.swift'
      - 'Tests/LiveTVLogic/**'

concurrency:
  group: livetv-logic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build and run
        run: |
          swiftc -O \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVTimeline.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVProgrammeInfo.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListWindow.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCatchup.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVReminderList.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGMatch.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVEPGSourceList.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVChannelNames.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVListOrder.swift \
            tvosApp/NuvioTV/Sources/Core/LiveTV/LiveTVCustomGroups.swift \
            Tests/LiveTVLogic/main.swift \
            -o livetv-tests
          ./livetv-tests
