name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'release/**'
      - 'apps.json'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app

      # The app uses tvOS 27 SDK APIs (e.g. tabViewSidebarHeader), so it needs
      # Xcode 27; "latest" also picks a beta when no stable 27 is installed.
      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION || 'latest' }}

      - name: Install Tuist (pinned in mise.toml)
        uses: jdx/mise-action@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          mise exec -- tuist version
          xcrun --sdk appletvos --show-sdk-version

      # The player's prebuilt binaries (MPVKit, FFmpeg, OpenSSL, libass, ...)
      # are GitHub release downloads, which time out (HTTP 504) during GitHub
      # incidents. Keep SwiftPM's shared artifact cache between runs, and
      # retry only the package resolution, so a real compile error still
      # fails once and fast.
      - name: Cache Swift package binaries
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('tvosApp/.package.resolved', 'Vendor/AetherEngine/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages (with retries)
        run: |
          cd tvosApp
          for attempt in 1 2 3 4; do
            if mise exec -- tuist generate --no-open; then exit 0; fi
            echo "::warning::Package resolution failed (attempt $attempt); retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Build unsigned IPA
        env:
          NUVIO_IPA_OUTPUT_DIR: ${{ runner.temp }}/ipa
        run: mise exec -- bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: NuvioTVOSxIPTV-unsigned-ipa
          path: ${{ runner.temp }}/ipa/NuvioTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Same app without the App Group, for sideloaders that can't register
      # it with Apple. Artifact only: releases keep a single .ipa asset, which
      # the AltStore source and README links pick up.
      - name: Upload IPA artifact without App Group
        uses: actions/upload-artifact@v6
        with:
          name: NuvioTVOSxIPTV-unsigned-ipa-no-appgroup
          path: ${{ runner.temp }}/ipa/NuvioTV-unsigned-no-appgroup.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ runner.temp }}/ipa/NuvioTV-unsigned.ipa#NuvioTVOSxIPTV-${GITHUB_REF_NAME}-unsigned.ipa" \
            --title "NuvioTVOSxIPTV $GITHUB_REF_NAME" \
            --notes "Unsigned tvOS IPA – sideload and re-sign with your own Apple ID."

          # Releases created with GITHUB_TOKEN don't fire `release` events, so
          # start the AltStore source and README updates explicitly.
          gh workflow run altstore.yml --ref main
          gh workflow run update-latest-beta.yml --ref main -f tag="$GITHUB_REF_NAME"
